# Bygger AutoComix för Windows och Linux och kör ett självtest per plattform.
# Starta manuellt (Actions -> Build -> Run workflow) eller pusha en tagg v* för att skapa en release.
name: Build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write   # för att skapa release med filerna

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, name: windows-x64, out: dist/AutoComix.exe}
          - {os: ubuntu-22.04, name: linux-x64, out: dist/AutoComix}       # glibc 2.35 => kör på de flesta distar
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Linux-bibliotek för Qt
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libfontconfig1 libdbus-1-3
      - name: Beroenden
        run: pip install -r requirements.txt pyinstaller pillow pytest
      - name: Tester
        run: python -m pytest -q tests
      - name: Bygg
        run: pyinstaller --noconfirm AutoComix.spec
      - name: Självtest
        shell: bash
        env: {QT_QPA_PLATFORM: offscreen}
        run: |
          python build_tools/make_test_cbz.py test.cbz
          "${{ matrix.out }}" test.cbz --window --selftest=res.json || true
          cat res.json
          python -c "import json,sys; r=json.load(open('res.json')); sys.exit(0 if r['ok'] and r['panels']>0 else 1)"
      - name: Packa
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a ../AutoComix-${{ matrix.name }}.zip AutoComix.exe;
          else tar czf ../AutoComix-${{ matrix.name }}.tar.gz AutoComix; fi
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}  # taggar läggs i Releases (räknas inte mot lagringskvoten)
        with:
          name: AutoComix-${{ matrix.name }}
          path: AutoComix-${{ matrix.name }}.*
          retention-days: 1
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: {files: "AutoComix-${{ matrix.name }}.*"}
