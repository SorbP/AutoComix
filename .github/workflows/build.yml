# Builds AutoComix (older versions: PanelView) for Windows and Linux and runs a self-test per platform.
# Only started manually (Actions -> Build -> Run workflow). Every version is tagged (v2.x.y) without building;
# give the tag in the "release" field to build that version and put the files under Releases.
# The license texts (AGPL-3.0 + third party) are always added from main, so older versions get them too.
name: Build
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Tag to release, e.g. v2.18.0 (empty = only build the current branch)"
        required: false
        default: ""

permissions:
  contents: write   # to create a release with the files

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, name: windows-x64}
          - {os: ubuntu-22.04, name: linux-x64}       # glibc 2.35 => runs on most distributions
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.release || github.ref }}"}
      - uses: actions/checkout@v4   # the license script and license texts from main
        with: {ref: main, path: _ci}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Linux libraries for Qt
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libfontconfig1 libdbus-1-3
      - name: Beroenden
        run: pip install -r requirements.txt pyinstaller pillow pytest packaging
      - name: Tester
        run: python -m pytest -q tests --ignore=_ci
      - name: Bygg
        shell: bash
        run: |
          spec=$(ls *.spec | head -1); app=$(basename "$spec" .spec)
          pyinstaller --noconfirm "$spec"
          if [ -d "dist/$app" ]; then exe="dist/$app/$app"; else exe="dist/$app"; fi   # folder mode from 2.17.0
          [ "$RUNNER_OS" = "Windows" ] && exe="$exe.exe"
          echo "APP=$app" >> "$GITHUB_ENV"; echo "EXE=$exe" >> "$GITHUB_ENV"
          echo "PKG=$app-${{ inputs.release || 'dev' }}-${{ matrix.name }}" >> "$GITHUB_ENV"
      - name: Self-test
        shell: bash
        env: {QT_QPA_PLATFORM: offscreen}
        run: |
          python build_tools/make_test_cbz.py test.cbz
          "$EXE" test.cbz --window --selftest=res.json || true
          cat res.json
          python -c "import json,sys; r=json.load(open('res.json')); sys.exit(0 if r['ok'] and r['panels']>0 else 1)"
      - name: Package (with licenses)
        shell: bash
        run: |
          mkdir -p "pkg/$APP"
          if [ -d "dist/$APP" ]; then cp -r "dist/$APP/." "pkg/$APP/"; else cp "$EXE" "pkg/$APP/"; fi
          cp requirements.txt _ci/requirements.txt   # licenses for the dependencies this version has
          python _ci/build_tools/collect_licenses.py "pkg/$APP"
          cd pkg
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a "../$PKG.zip" "$APP"; else tar czf "../$PKG.tar.gz" "$APP"; fi
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.release == '' }}  # releases go in Releases (does not count against the storage quota)
        with:
          name: ${{ env.PKG }}
          path: ${{ env.PKG }}.*
          retention-days: 1
      - name: Release
        if: ${{ inputs.release != '' }}
        uses: softprops/action-gh-release@v2
        with: {tag_name: "${{ inputs.release }}", name: "${{ env.APP }} ${{ inputs.release }}", files: "${{ env.PKG }}.*"}
